# _knowledge/sources.yaml — the source registry (Layer 1)
#
# One entry per domain Claude is allowed to speak authoritatively about.
# The `/context-brief` skill reads this to decide WHERE to look before it
# writes a single line of code or design.
#
# Hard rule this file exists to enforce:
#   Never design or code from memory when a registered source exists.
#
# `verified` dates are real probe results, not aspirations. Re-probe with:
#   node E:/dev-recipes/_knowledge/scripts/verify-sources.js

version: 1
updated: 2026-08-16

# ---------------------------------------------------------------------------
# The cost ladder. Route to the cheapest tier that can actually answer.
# ---------------------------------------------------------------------------
tiers:
  1:
    name: context7
    use_for: Library/API truth — signatures, config, version-specific behaviour.
    tool: mcp__context7__query-docs (resolve-library-id first if no id below)
    cost: free tier, ~9k libraries, version-pinnable
  2:
    name: llms-txt
    use_for: Docs sites that publish llms.txt — narrative guidance, conventions.
    tool: WebFetch
    cost: free
  3:
    name: websearch
    use_for: Discovery — "what is current", "did X change", finding a source at all.
    tool: WebSearch
    cost: free
  4:
    name: firecrawl
    use_for: >
      Real aesthetic/motion patterns from sites with no docs, and JS-heavy pages
      nothing else can read. This is the ONLY thing Firecrawl is for.
    tool: firecrawl skills / CLI
    cost: metered — 1400 credits/cycle, 2 concurrent jobs (probed 2026-08-16)
    budget:
      max_credits_per_run: 20
      requires: an explicit design/motion reference request, or tiers 1-3 exhausted

defaults:
  brief_ttl_days: 30          # a cached brief older than this is re-verified
  pin_versions_from: package.json   # always pin to what the project installs

# ---------------------------------------------------------------------------
# Registry
# ---------------------------------------------------------------------------
domains:

  # --- Frontend framework -------------------------------------------------
  - id: react
    name: React
    kind: library
    tier: 1
    trust: official
    context7:
      id: /reactjs/react.dev
      alt: /react/react          # has v19.2.7 / v18.2.0 version pins
      note: Prefer /react/react when a specific React version must be pinned.
    llms_txt: https://react.dev/llms.txt
    docs: https://react.dev
    verified: 2026-08-16
    verified_note: llms.txt 200 (14.3 KB); context7 id resolved, 6067 snippets.

  - id: react-router
    name: React Router
    kind: library
    tier: 1
    trust: official
    context7:
      id: /remix-run/react-router
      versions: [react-router_7.9.4, react_router_7_8_2, 7.6.2, v6.3.0]
    llms_txt: null
    llms_txt_checked: 2026-08-16
    llms_txt_note: >
      404 on /llms.txt, /llms-full.txt and /docs/llms.txt. No llms.txt exists —
      do not retry tier 2 for this domain, go straight to Context7.
    docs: https://reactrouter.com
    verified: 2026-08-16

  - id: vite
    name: Vite
    kind: library
    tier: 2
    trust: official
    llms_txt: https://vite.dev/llms.txt
    docs: https://vite.dev
    verified: 2026-08-16
    verified_note: llms.txt 200 (3.5 KB) — small enough to fetch whole.

  # --- Styling ------------------------------------------------------------
  - id: tailwind
    name: Tailwind CSS
    kind: library
    tier: 1
    trust: official
    context7:
      id: /websites/tailwindcss          # v4 (current)
      v3: /websites/v3_tailwindcss       # v3.x — 3071 snippets
      note: >
        MUST branch on the project's installed major. v4 is CSS-first
        (@import "tailwindcss", @theme); v3 is JS-config (tailwind.config.js,
        content globs). Emitting v4 syntax into a v3 project silently
        produces unstyled output — this is the #1 memory-vs-reality trap here.
    llms_txt: null
    llms_txt_checked: 2026-08-16
    llms_txt_note: >
      404 on /llms.txt, /llms-full.txt, /docs/llms.txt and v3.tailwindcss.com.
      RESEARCH.md claimed Tailwind publishes llms.txt — it does not. Tier 1 only.
    docs: https://tailwindcss.com/docs
    verified: 2026-08-16

  - id: shadcn
    name: shadcn/ui
    kind: library
    tier: 2
    trust: official
    llms_txt: https://ui.shadcn.com/llms.txt
    docs: https://ui.shadcn.com
    verified: 2026-08-16
    verified_note: llms.txt 200 (12.3 KB).

  - id: lucide
    name: Lucide icons
    kind: library
    tier: 2
    trust: official
    llms_txt: https://lucide.dev/llms.txt
    docs: https://lucide.dev
    verified: 2026-08-16
    verified_note: llms.txt 200 (29.3 KB) — fetch with a narrow prompt, it is large.

  # --- Motion -------------------------------------------------------------
  - id: motion
    name: Motion (formerly Framer Motion)
    kind: library
    tier: 2
    trust: official
    llms_txt: https://motion.dev/llms.txt
    docs: https://motion.dev/docs
    verified: 2026-08-16
    verified_note: llms.txt 200 (47.7 KB).
    local: E:/dev-recipes/website-animation-patterns/libraries/framer-motion/

  - id: gsap
    name: GSAP
    kind: library
    tier: 2
    trust: official
    llms_txt: https://gsap.com/llms.txt
    docs: https://gsap.com/docs
    verified: 2026-08-16
    verified_note: llms.txt 200 (25.4 KB).
    local: E:/dev-recipes/website-animation-patterns/libraries/gsap/
    local_note: Read the local recipe FIRST — it holds hard-won useGSAP/contextSafe gotchas.

  # --- Backend ------------------------------------------------------------
  - id: express
    name: Express
    kind: library
    tier: 1
    trust: official
    context7:
      id: /expressjs/express
      versions: [v5.2.0, v5.1.0, 4_21_2]
      note: >
        Express 5 changed error semantics (auto-catches rejected promises from
        async handlers). Always pin the major — v4 and v5 answers differ.
    llms_txt: https://expressjs.com/llms.txt
    docs: https://expressjs.com
    verified: 2026-08-16
    verified_note: llms.txt 200 but only 1.5 KB (index stub) — Context7 is the real source.

  - id: typescript
    name: TypeScript
    kind: library
    tier: 1
    trust: official
    llms_txt: null
    llms_txt_checked: 2026-08-16
    llms_txt_note: 404 on typescriptlang.org/llms.txt.
    docs: https://www.typescriptlang.org/docs/
    verified: 2026-08-16
    context7:
      id: null
      note: Resolve at query time via resolve-library-id — not yet pinned.

  # --- Platform -----------------------------------------------------------
  - id: vercel
    name: Vercel
    kind: platform
    tier: 2
    trust: official
    llms_txt: https://vercel.com/llms.txt
    docs: https://vercel.com/docs
    verified: 2026-08-16
    verified_note: llms.txt 200 (211 KB) — LARGE. Always WebFetch with a narrow prompt.

  - id: supabase
    name: Supabase
    kind: platform
    tier: 2
    trust: official
    llms_txt: https://supabase.com/llms.txt
    docs: https://supabase.com/docs
    verified: 2026-08-16
    verified_note: llms.txt 200 (2.3 KB index — links out to per-product llms.txt).

# ---------------------------------------------------------------------------
# Tier 4 only. Aesthetic/motion reference — no docs exist for "how this feels".
# Firecrawl is rationed; these are the sanctioned targets.
# ---------------------------------------------------------------------------
design_refs:
  local_first: E:/dev-recipes/website-animation-patterns/awwwards-refs/
  local_note: >
    Check awwwards-refs/ and _core/principles.md before spending a credit.
    Extraction procedure is documented in awwwards-refs/how-to-extract.md.
  targets:
    - id: awwwards
      url: https://www.awwwards.com/websites/
      why: Curated motion/layout reference. JS-heavy — genuinely needs Firecrawl.
    - id: tympanus
      url: https://tympanus.net/codrops/
      why: Technique write-ups with source. Often readable by WebFetch first — try tier 2.
      local: E:/dev-recipes/website-animation-patterns/awwwards-refs/tympanus.md
    - id: godly
      url: https://godly.website/
      why: Design reference gallery.

# ---------------------------------------------------------------------------
# Adding a domain: probe it before you commit it.
#   curl -s -o /dev/null -w "%{http_code} %{size_download}" -L <url>/llms.txt
# A 404 gets recorded as `llms_txt: null` WITH the checked date, so the next
# run does not waste a fetch rediscovering the same absence.
# ---------------------------------------------------------------------------
